apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        settings:
          url: ${RESPONDER_WEBHOOK_URL}
          httpMethod: POST
        disableResolveMessage: true

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: ["alertname", "http_route"]
    group_wait: 5s
    group_interval: 1m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: order-tracker
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-tracker-5xx
        title: OrderTracker5xx
        condition: C
        for: 0s
        # No 5xx series means no server errors, so treat it as healthy.
        noDataState: OK
        execErrState: Error
        labels:
          severity: page
          service: order-tracker
        annotations:
          summary: "{{ $$labels.http_route }} returned {{ $$values.B.Value }} 5xx responses in the last 5 minutes"
          description: "Server errors on endpoint {{ $$labels.http_route }} over a 5m window. Dashboard: http://localhost:3000/d/order-tracker/order-tracker"
          endpoint: "{{ $$labels.http_route }}"
          window: 5m
          dashboard_url: http://localhost:3000/d/order-tracker/order-tracker
        dashboardUid: order-tracker
        panelId: 5
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: 'sum by (http_route) (increase(order_tracker_requests_total{http_response_status_code=~"5.."}[5m]))'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
